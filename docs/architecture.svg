<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1550 790" width="1550" height="790" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#1f2328">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/></marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f8a4f"/></marker>
    <marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c5cc4"/></marker>
    <style>
      .t { font-weight: 600; font-size: 16px; }
      .c { font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace; font-size: 12.5px; fill: #1f2328; }
      .s { font-size: 12.5px; fill: #4b5563; }
      .h { font-weight: 600; fill: #2f6f45; font-size: 14px; }
      .r { font-size: 12px; fill: #b23b3b; }
    </style>
  </defs>
  <rect width="1550" height="790" fill="#ffffff"/>

  <text x="30" y="38" font-size="20" font-weight="700">LeetUP architecture</text>

  <!-- LLM API and local server -->
  <rect x="220" y="62" width="920" height="46" rx="8" fill="#f1ecfb" stroke="#7c5cc4"/>
  <text x="680" y="91" class="t" text-anchor="middle">Anthropic Messages API (Claude)</text>

  <rect x="220" y="136" width="920" height="46" rx="8" fill="#fbf6ea" stroke="#b08a3e"/>
  <text x="680" y="164" text-anchor="middle"><tspan class="t">Local API server</tspan><tspan class="c" dx="10">server/api.mjs</tspan><tspan class="s" dx="10">holds the API key; receives POST /api/chat requests and calls Anthropic</tspan></text>

  <g stroke="#7c5cc4" stroke-width="1.6">
    <line x1="300" y1="110" x2="300" y2="134" marker-start="url(#p)" marker-end="url(#p)"/>
    <line x1="1060" y1="110" x2="1060" y2="134" marker-start="url(#p)" marker-end="url(#p)"/>
    <line x1="300" y1="184" x2="300" y2="238" marker-start="url(#p)" marker-end="url(#p)"/>
    <line x1="1060" y1="184" x2="1060" y2="238" marker-start="url(#p)" marker-end="url(#p)"/>
  </g>

  <!-- Pipeline row -->
  <g text-anchor="middle">
    <rect x="30" y="240" width="160" height="130" rx="8" fill="#f5f5f4" stroke="#8a8a85"/>
    <text x="110" y="292" class="t">Learner types</text>
    <text x="110" y="322" class="s">text or code</text>

    <rect x="220" y="240" width="160" height="130" rx="8" fill="#f1ecfb" stroke="#7c5cc4"/>
    <text x="300" y="292" class="t">1 · Assess</text>
    <text x="300" y="322" class="s">Model returns</text>
    <text x="300" y="338" class="s">structured assessment</text>

    <rect x="410" y="240" width="160" height="130" rx="8" fill="#eef4fb" stroke="#4a78b5"/>
    <text x="490" y="292" class="t">2 · Validate</text>
    <text x="490" y="322" class="s">Code checks evidence</text>
    <text x="490" y="338" class="s">quotations and form</text>

    <rect x="600" y="240" width="160" height="130" rx="8" fill="#eef4fb" stroke="#4a78b5"/>
    <text x="680" y="292" class="t">3 · Decide</text>
    <text x="680" y="322" class="s">Code selects the</text>
    <text x="680" y="338" class="s">tutoring action</text>

    <rect x="790" y="240" width="160" height="130" rx="8" fill="#eef4fb" stroke="#4a78b5"/>
    <text x="870" y="282" class="t">4 · Prepare</text>
    <text x="870" y="302" class="t">state update</text>
    <text x="870" y="322" class="s">Code builds an updated</text>
    <text x="870" y="338" class="s">session copy</text>

    <rect x="980" y="240" width="160" height="130" rx="8" fill="#f1ecfb" stroke="#7c5cc4"/>
    <text x="1060" y="282" class="t">5 · Generate</text>
    <text x="1060" y="302" class="t">reply</text>
    <text x="1060" y="322" class="s">Model phrases the action;</text>
    <text x="1060" y="338" class="s">code handles completion</text>
    <text x="1060" y="354" class="s">summaries, review offers</text>

    <rect x="1170" y="240" width="160" height="130" rx="8" fill="#eef4fb" stroke="#4a78b5"/>
    <text x="1250" y="282" class="t">6 · Apply state</text>
    <text x="1250" y="302" class="t">and display</text>
    <text x="1250" y="322" class="s">Commit prepared</text>
    <text x="1250" y="338" class="s">session and show reply</text>

    <rect x="1360" y="240" width="160" height="130" rx="8" fill="#f5f5f4" stroke="#8a8a85"/>
    <text x="1440" y="292" class="t">Learner sees</text>
    <text x="1440" y="322" class="s">reply + checklist</text>
  </g>

  <!-- flow arrows -->
  <g stroke="#4b5563" stroke-width="1.6">
    <line x1="190" y1="305" x2="218" y2="305" marker-end="url(#a)"/>
    <line x1="380" y1="305" x2="408" y2="305" marker-end="url(#a)"/>
    <line x1="570" y1="305" x2="598" y2="305" marker-end="url(#a)"/>
    <line x1="760" y1="305" x2="788" y2="305" marker-end="url(#a)"/>
    <line x1="950" y1="305" x2="978" y2="305" marker-end="url(#a)"/>
    <line x1="1140" y1="305" x2="1168" y2="305" marker-end="url(#a)"/>
    <line x1="1330" y1="305" x2="1358" y2="305" marker-end="url(#a)"/>
  </g>

  <!-- Prepared copy (not yet live) -->
  <rect x="880" y="398" width="270" height="54" rx="8" fill="#ffffff" stroke="#2f8a4f" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="1015" y="421" class="h" text-anchor="middle">Prepared session copy</text>
  <text x="1015" y="440" class="s" text-anchor="middle">not live until stage 6</text>

  <line x1="920" y1="372" x2="920" y2="396" stroke="#2f8a4f" stroke-width="1.6" marker-end="url(#g)"/>
  <line x1="1060" y1="396" x2="1060" y2="373" stroke="#4b5563" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#a)"/>
  <path d="M1150,425 L1215,425 L1215,373" fill="none" stroke="#2f8a4f" stroke-width="1.6" marker-end="url(#g)"/>

  <text x="880" y="472" class="r">If a model call fails, the prepared copy is discarded. The</text>
  <text x="880" y="487" class="r">learner’s message remains visible with an error notice;</text>
  <text x="880" y="502" class="r">existing evidence and hint levels are preserved.</text>

  <!-- Reasoning areas -->
  <rect x="30" y="520" width="160" height="192" rx="8" fill="#ffffff" stroke="#3a9a5b" stroke-width="1.5"/>
  <text x="46" y="546" class="t">Reasoning areas</text>
  <text x="46" y="570" class="h">Required</text>
  <text x="46" y="590" class="c">approach</text>
  <text x="46" y="608" class="c">justification</text>
  <text x="46" y="626" class="c">correctness</text>
  <text x="46" y="644" class="c">complexity</text>
  <text x="46" y="666" class="h">Optional</text>
  <text x="46" y="684" class="c">requirements</text>
  <text x="46" y="701" class="c">comparison</text>

  <!-- Session state -->
  <rect x="220" y="520" width="1300" height="192" rx="8" fill="#eef8f1" stroke="#3a9a5b" stroke-width="1.5"/>
  <text x="240" y="548" class="t">SessionState</text>
  <text x="362" y="548" class="s">committed after a successful tutoring turn</text>

  <g>
    <rect x="236" y="564" width="244" height="124" rx="6" fill="#ffffff" stroke="#3a9a5b" stroke-opacity="0.6"/>
    <line x1="236" y1="594" x2="480" y2="594" stroke="#3a9a5b" stroke-opacity="0.4"/>
    <text x="250" y="585" class="h">Evidence</text>
    <text x="466" y="585" class="s" text-anchor="end">per area</text>
    <text x="250" y="616" class="c">status</text>
    <text x="250" y="636" class="c">support</text>
    <text x="250" y="656" class="c">quotes, creditedQuotes</text>
    <text x="250" y="676" class="c">gap</text>

    <rect x="492" y="564" width="244" height="124" rx="6" fill="#ffffff" stroke="#3a9a5b" stroke-opacity="0.6"/>
    <line x1="492" y1="594" x2="736" y2="594" stroke="#3a9a5b" stroke-opacity="0.4"/>
    <text x="506" y="585" class="h">SupportLadder</text>
    <text x="722" y="585" class="s" text-anchor="end">per area</text>
    <text x="506" y="616" class="c">attention</text>
    <text x="506" y="636" class="c">assistance</text>

    <rect x="748" y="564" width="244" height="124" rx="6" fill="#ffffff" stroke="#3a9a5b" stroke-opacity="0.6"/>
    <line x1="748" y1="594" x2="992" y2="594" stroke="#3a9a5b" stroke-opacity="0.4"/>
    <text x="762" y="585" class="h">Navigation</text>
    <text x="762" y="616" class="c">focusArea</text>
    <text x="762" y="636" class="c">phase</text>
    <text x="762" y="656" class="c">awaitingCheck</text>
    <text x="762" y="676" class="c">deferredAreas</text>

    <rect x="1004" y="564" width="244" height="124" rx="6" fill="#ffffff" stroke="#3a9a5b" stroke-opacity="0.6"/>
    <line x1="1004" y1="594" x2="1248" y2="594" stroke="#3a9a5b" stroke-opacity="0.4"/>
    <text x="1018" y="585" class="h">Approach</text>
    <text x="1018" y="616" class="c">name</text>
    <text x="1018" y="636" class="c">description</text>
    <text x="1018" y="656" class="c">changedFrom</text>

    <rect x="1260" y="564" width="244" height="124" rx="6" fill="#ffffff" stroke="#3a9a5b" stroke-opacity="0.6"/>
    <line x1="1260" y1="594" x2="1504" y2="594" stroke="#3a9a5b" stroke-opacity="0.4"/>
    <text x="1274" y="585" class="h">Conversation</text>
    <text x="1274" y="616" class="c">messages</text>
    <text x="1274" y="636" class="c">turn</text>
  </g>

  <line x1="190" y1="616" x2="232" y2="616" stroke="#3a9a5b" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#g)"/>

  <!-- reads from committed state -->
  <g stroke="#4b5563" stroke-width="1.4" stroke-dasharray="5 4">
    <line x1="300" y1="518" x2="300" y2="373" marker-end="url(#a)"/>
    <line x1="680" y1="518" x2="680" y2="373" marker-end="url(#a)"/>
    <line x1="830" y1="518" x2="830" y2="373" marker-end="url(#a)"/>
    <line x1="1440" y1="518" x2="1440" y2="373" marker-end="url(#a)"/>
  </g>
  <text x="689" y="450" class="s">reads</text>

  <!-- commit -->
  <line x1="1290" y1="372" x2="1290" y2="516" stroke="#2f8a4f" stroke-width="2.4" marker-end="url(#g)"/>
  <text x="1299" y="450" class="s" fill="#2f8a4f">commits</text>

  <!-- legend -->
  <rect x="30" y="752" width="14" height="14" rx="3" fill="#f1ecfb" stroke="#7c5cc4"/>
  <text x="52" y="764" class="s">LLM call</text>
  <rect x="130" y="752" width="14" height="14" rx="3" fill="#eef4fb" stroke="#4a78b5"/>
  <text x="152" y="764" class="s">Deterministic code</text>
  <rect x="290" y="752" width="14" height="14" rx="3" fill="#fbf6ea" stroke="#b08a3e"/>
  <text x="312" y="764" class="s">Local server</text>
  <rect x="410" y="752" width="14" height="14" rx="3" fill="#f5f5f4" stroke="#8a8a85"/>
  <text x="432" y="764" class="s">Learner interface</text>
  <rect x="560" y="752" width="14" height="14" rx="3" fill="#ffffff" stroke="#2f8a4f" stroke-dasharray="3 2"/>
  <text x="582" y="764" class="s">Prepared copy</text>
  <line x1="690" y1="759" x2="722" y2="759" stroke="#4b5563" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#a)"/>
  <text x="730" y="764" class="s">Reads state</text>
  <line x1="830" y1="759" x2="862" y2="759" stroke="#2f8a4f" stroke-width="2.4" marker-end="url(#g)"/>
  <text x="870" y="764" class="s">Writes or commits state</text>
</svg>
