<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="LeetUP — a Socratic CUI for guided algorithmic reasoning over curated, LeetCode-style problems. CS3249 CUI prototype. Not affiliated with LeetCode."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <title>LeetUP — Think before you solve.</title>
    <script>
      // Stamp the saved theme before first paint so dark mode never flashes white.
      try {
        var t = localStorage.getItem('leetup:theme')
        if (t === 'dark' || t === 'light')
          document.documentElement.dataset.theme = t
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
